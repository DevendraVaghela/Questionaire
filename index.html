<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sejal's Decision Making Machine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Allura&display=swap" rel="stylesheet">
</head>
<body>
    <header id="Intro">
        <h1 id="top">Welcome to Sejal's</h1>
        <h1>Decision Making Machine</h1>
    </header>
    <div class="Main">
        <div id="Para">
            <p>I hope you're having a really good day. Now let me make it much better.</p>
            <p>Press Start to make the mistake of letting us handle your decisions</p>
        </div>
        <button type="button" id="Start">Start</button>
        <div id="question-container">
        </div>
        <div id="analysis">
            <p id="analysisText"></p>
        </div>
        <div id="result">
            <p id="resultText"></p>
        </div>
        <div id="ask">
            <p id="askText"></p>
        </div>
        <div id="garbaPage">
            <div id="giftBox">
                <div class="boxLid"></div>
                <div class="boxBody"></div>
            </div>
            <p id="garbaText">Will you be my Garba Partner? ❤️</p>
            <div id="answerButtons">
                <Button id="Yes">Yes ❤️</Button>
                <Button id="No">No 😭</Button>
                <div id="noPopup">
                    <div id="popupBox">
                        <h3>Wait a Minute...👀</h3>
                        <p>Please Reconsider.</p>
                        <button id="Reconsider">Okay 😭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
